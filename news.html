<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>News | Daily Viral News Ishank</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f8;
    color:#171717;
}

header{
    background:#111827;
    color:white;
    padding:18px 15px;
}

.header{
    max-width:900px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.logo span{
    color:#ef4444;
}

.back{
    color:white;
    text-decoration:none;
    background:#d71920;
    padding:10px 14px;
    border-radius:7px;
}

.container{
    width:94%;
    max-width:900px;
    margin:25px auto;
}

.article{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 4px 20px #0001;
}

.article-image{
    width:100%;
    max-height:500px;
    object-fit:cover;
    display:block;
}

.article-content{
    padding:25px;
}

.category{
    display:inline-block;
    background:#d71920;
    color:white;
    padding:6px 10px;
    border-radius:5px;
    font-size:13px;
    font-weight:bold;
    margin-bottom:12px;
}

h1{
    font-size:32px;
    line-height:1.3;
    margin-bottom:12px;
}

.date{
    color:#777;
    font-size:13px;
    margin-bottom:22px;
}

.content{
    font-size:18px;
    line-height:1.8;
    white-space:pre-line;
}

.loading{
    text-align:center;
    padding:40px;
    font-size:18px;
}

@media(max-width:600px){

    h1{
        font-size:25px;
    }

    .article-content{
        padding:18px;
    }

    .content{
        font-size:16px;
        line-height:1.7;
    }

}
</style>
</head>

<body>

<header>
    <div class="header">

        <div class="logo">
            Daily Viral <span>News Ishank</span>
        </div>

        <a class="back"
           href="index.html">
           ← वापस
        </a>

    </div>
</header>


<div class="container">

    <div id="article" class="article">
        <div class="loading">
            📰 खबर लोड हो रही है...
        </div>
    </div>

</div>


<script>

const SUPABASE_URL =
"https://ebpmskrureyllasggrzn.supabase.co";

const SUPABASE_KEY =
"sb_publishable_FN1q-DrwOdqj1r0o14seIA_lDxKRkes";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


function escapeNews(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


async function loadArticle(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    const id = params.get("id");

    const article =
        document.getElementById("article");


    if(!id){

        article.innerHTML = `
            <div class="loading">
                ❌ खबर नहीं मिली
            </div>
        `;

        return;
    }


    const {data,error} =
        await supabaseClient
        .from("news")
        .select("*")
        .eq("id",id)
        .eq("published",true)
        .single();


    if(error || !data){

        article.innerHTML = `
            <div class="loading">
                ❌ यह खबर उपलब्ध नहीं है।
            </div>
        `;

        return;
    }


    const date =
        new Date(data.created_at)
        .toLocaleString("hi-IN");


    article.innerHTML = `

        ${
            data.image_url
            ?
            `<img
                class="article-image"
                src="${data.image_url}"
                alt="${escapeNews(data.title)}"
            >`
            :
            ""
        }

        <div class="article-content">

            <div class="category">
                ${escapeNews(data.category)}
            </div>

            <h1>
                ${escapeNews(data.title)}
            </h1>

            <div class="date">
                📅 ${date}
                • Daily Viral News Ishank
            </div>

            <div class="content">
                ${escapeNews(data.content)}
            </div>

        </div>
    `;

}


loadArticle();

</script>

</body>
  </html>
